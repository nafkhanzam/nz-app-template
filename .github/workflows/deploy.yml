name: Deploy to VPS

on:
  push:
    branches:
      # development omitted on purpose: secrets/development/ does not exist
      # yet, so a push there would only trigger a job that fails validation.
      - production
    paths:
      - apps/server/**
      - apps/web/**
      - deploy/**
      - .github/workflows/**

env:
  APP_ENV: ${{ github.ref_name }}

jobs:
  deploy:
    # Still off: this deploys onto infrastructure that does not exist yet —
    # no GHCR images (Langkah 5), no VPS stack (Langkah 6), no real
    # blue-green (Langkah 7). See deploy/legacy/blue-green-deploy.sh.
    if: false
    name: Deploy to VPS
    runs-on: self-hosted
    environment: ${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # server.sops.yaml references $POSTGRES_PASSWORD (from infra.sops.yaml)
      # and $APP_NAME/$BASE_DOMAIN (from deploy/env/production.env) — these
      # only resolve if all three land in the same .env, because
      # dotenv-expand (apps/server/src/env.ts) resolves $VAR against
      # whatever else it just loaded from that one file, not across files.
      - name: Decrypt and merge secrets
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          set -euo pipefail
          cat deploy/env/${{ env.APP_ENV }}.env \
            <(sops -d --output-type dotenv secrets/${{ env.APP_ENV }}/infra.sops.yaml) \
            <(sops -d --output-type dotenv secrets/${{ env.APP_ENV }}/server.sops.yaml) \
            > apps/server/.env
          cat deploy/env/${{ env.APP_ENV }}.env \
            <(sops -d --output-type dotenv secrets/${{ env.APP_ENV }}/web.sops.yaml) \
            > apps/web/.env

      - name: Validate apps/server/.env against the runtime schema
        run: pnpm exec tsx scripts/validate-env.ts apps/server/.env

      - name: Blue-green deploy
        run: bash deploy/legacy/blue-green-deploy.sh
