name: Build & Push Images

# Reusable: deploy.yml (Langkah 7) will call this via workflow_call once
# blue-green is wired up. Direct push trigger stays too, so images already
# land in GHCR before that exists — Langkah 5 doesn't depend on Langkah 7.
on:
  push:
    branches:
      - production
    paths:
      - apps/server/**
      - apps/web/**
      - pnpm-lock.yaml
      - .github/workflows/build.yml
  workflow_call:
    outputs:
      server_digest:
        description: "Digest of the pushed server image"
        value: ${{ jobs.build.outputs.server_digest }}
      web_digest:
        description: "Digest of the pushed web image"
        value: ${{ jobs.build.outputs.web_digest }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build & push
    runs-on: self-hosted
    timeout-minutes: 20
    outputs:
      server_digest: ${{ steps.server.outputs.digest }}
      web_digest: ${{ steps.web.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tagged by commit sha for traceability, but deploy.yml (Langkah 7) must
      # pull by digest, not tag — tags can be moved, digests can't.
      - name: Build & push server
        id: server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}-server:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

      - name: Build & push web
        id: web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Summary
        run: |
          echo "server: ghcr.io/${{ github.repository }}-server@${{ steps.server.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "web: ghcr.io/${{ github.repository }}-web@${{ steps.web.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
