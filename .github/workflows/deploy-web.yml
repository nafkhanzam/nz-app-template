name: Deploy web (Cloudflare Pages)

on:
  push:
    branches:
      - development
      - staging
      - production
    paths:
      - "apps/web/**"
      - "envs/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

concurrency:
  group: deploy-web-${{ github.ref_name }}
  cancel-in-progress: true

env:
  # envs/<branch>.enc.yaml used for the build; PUBLIC_* values are baked into the bundle.
  APP_ENV_NAME: ${{ github.ref_name }}

jobs:
  deploy:
    runs-on: self-hosted
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      # sops and its age key (SOPS_AGE_KEY) are provided by the runner VPS.
      - name: Ensure dotenvx
        run: command -v dotenvx >/dev/null || pnpm install -g @dotenvx/dotenvx

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: ./cli "$APP_ENV_NAME" build web

      # CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and APP_NAME (the Pages project name)
      # come from the decrypted env, so the command runs in a shell that has them loaded.
      - name: Deploy to Cloudflare Pages
        run:
          |
          ./cli "$APP_ENV_NAME" exec bash -c \
            'pnpm dlx wrangler@4 pages deploy apps/web/build --project-name="$APP_NAME" --branch="$GITHUB_REF_NAME"'
