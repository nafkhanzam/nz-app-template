# Production Garage config. Separate from ../deploy/garage.toml (used by the
# root docker-compose.services.yml for local dev, which needs `.web.localhost`)
# because root_domain can't be the same value in both places.
#
# Edit ROOT_DOMAIN_PLACEHOLDER below to match BASE_DOMAIN in
# deploy/env/<env>.env — TOML has no env-var interpolation, so this is a
# one-time manual edit per BASE_DOMAIN change, same as garage.toml itself.
replication_factor = 1
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "lmdb"

# rpc_secret comes from GARAGE_RPC_SECRET so no secret lives in this file.
rpc_bind_addr = "[::]:3901"

[s3_api]
api_bind_addr = "[::]:3900"
# Must match AWS_REGION or SigV4 signatures are rejected.
s3_region = "us-east-1"

[s3_web]
bind_addr = "[::]:3902"
# Bucket is read from the first label of the Host header — must match
# BASE_DOMAIN in deploy/env/<env>.env (§4.4).
root_domain = ".web.ROOT_DOMAIN_PLACEHOLDER"
index = "index.html"
