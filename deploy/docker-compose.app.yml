# One slot = one full deploy of server+web, brought up/down together so
# there's never a window where a new web bundle talks to an old API (§4.2).
# No ports published — Caddy edge reaches these by network alias only, on
# `edge`; `server-<slot>` also joins `appnet` to reach postgres/garage.
#
# Required env (set by deploy.sh before calling this file):
#   APP_NAME, APP_ENV, SLOT           - e.g. nz-app-template, production, blue
#   SERVER_IMAGE, WEB_IMAGE           - full ghcr.io ref *with digest*
#
# apps/server/.env and apps/web/.env are written by deploy.sh from the
# decrypted secrets right before this file is invoked (same convention as
# the current deploy.yml step "Decrypt and merge secrets").
name: ${APP_NAME}-${APP_ENV}-${SLOT}

services:
  server:
    image: ${SERVER_IMAGE}
    container_name: ${APP_NAME}-${APP_ENV}-server-${SLOT}
    restart: unless-stopped
    env_file:
      - ../apps/server/.env
    networks:
      edge:
        aliases:
          - server-${SLOT}
      appnet: {}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    image: ${WEB_IMAGE}
    container_name: ${APP_NAME}-${APP_ENV}-web-${SLOT}
    restart: unless-stopped
    env_file:
      - ../apps/web/.env
    networks:
      edge:
        aliases:
          - web-${SLOT}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  edge:
    external: true
  appnet:
    external: true
