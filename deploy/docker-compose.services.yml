# Production variant of the root docker-compose.services.yml — no ports
# published at all (§6.1: postgres must be unreachable from outside the
# VPS), joins the pre-created `appnet`/`edge` networks instead of its own.
# Brought up once during VPS setup, not per-deploy — deploy.sh never
# touches this file.
#
# Required env (source deploy/env/<env>.env, then decrypted infra.sops.yaml,
# before running `docker compose -f deploy/docker-compose.services.yml up -d`):
#   APP_NAME, APP_ENV, POSTGRES_PASSWORD, GARAGE_RPC_SECRET
name: ${APP_NAME}-${APP_ENV}-services

services:
  postgres:
    image: postgres:16-alpine
    container_name: ${APP_NAME}-${APP_ENV}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${APP_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - appnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  garage:
    image: dxflrs/garage:v2.3.0
    container_name: ${APP_NAME}-${APP_ENV}-garage
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
    volumes:
      - ./garage.production.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    networks:
      - appnet # reached by server-<slot> for signed S3 ops
      - edge # reached by caddy-edge, which proxies both garage ports (§4.3)
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  appnet:
    external: true
  edge:
    external: true

volumes:
  postgres_data:
  # Metadata and data are separate stores; both must be backed up (§7).
  garage_meta:
  garage_data:
