# Authentik blueprint: OAuth2/OIDC provider + application for this template,
# so registering it does not require a manual step in the Authentik admin UI.
#
# DRAFT — not yet applied anywhere. Before use:
#   1. Fill in authorization_flow / invalidation_flow slugs from the real
#      Authentik instance (`authentik_flows.flow` -> slug, visible in its
#      admin panel). Values below are placeholders on purpose.
#   2. Decide how this gets applied to the running instance (docker exec +
#      `ak apply_blueprint`, vs a REST API call with an admin token) — that
#      depends on how Authentik is deployed relative to this app, which is
#      not yet known. See milestone.md #13.
#
# ${VAR} placeholders are substituted the same way as deploy/env/production.env
# (§4.4) — plain shell-style substitution before this file is applied, not
# Authentik's own !Env tag. One substitution mechanism for the whole repo.
#
# Reference: https://docs.goauthentik.io/customize/blueprints/
version: 1
metadata:
  name: ${APP_NAME}-${APP_ENV}-oidc
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    identifiers:
      name: ${APP_NAME}-${APP_ENV}
    state: present
    attrs:
      name: ${APP_NAME}-${APP_ENV}
      client_type: confidential
      client_id: ${OIDC_CLIENT_ID}
      client_secret: ${OIDC_CLIENT_SECRET}
      redirect_uris:
        - url: ${OIDC_REDIRECT_URI}
          matching_mode: strict
      # PLACEHOLDER — verify against the real instance before applying.
      authorization_flow: !Find [authentik_flows.flow, [slug, "<VERIFY_AGAINST_REAL_INSTANCE>"]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, "<VERIFY_AGAINST_REAL_INSTANCE>"]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
  - model: authentik_core.application
    id: application
    identifiers:
      slug: ${APP_NAME}-${APP_ENV}
    state: present
    attrs:
      name: ${APP_NAME}-${APP_ENV}
      slug: ${APP_NAME}-${APP_ENV}
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, "${APP_NAME}-${APP_ENV}"]]
