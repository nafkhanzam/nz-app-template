replication_factor = 1
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "lmdb"

# rpc_secret comes from GARAGE_RPC_SECRET so no secret lives in this file.
rpc_bind_addr = "[::]:3901"

[s3_api]
api_bind_addr = "[::]:3900"
# Must match AWS_REGION or SigV4 signatures are rejected.
s3_region = "us-east-1"

[s3_web]
bind_addr = "[::]:3902"
# Bucket is read from the first label of the Host header.
root_domain = ".web.localhost"
index = "index.html"
