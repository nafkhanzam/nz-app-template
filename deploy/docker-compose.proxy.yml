# caddy-edge — §4.3. Brought up once during VPS setup, like
# docker-compose.services.yml; deploy.sh only writes slot files into it and
# reloads, never restarts this container.
#
# caddy_data MUST be a persistent volume — it holds ACME certificates.
# Losing it means re-issuing all 4 certs and risking Let's Encrypt's rate
# limit (§7).
#
# The four domains are pure derivations of APP_NAME/APP_ENV/BASE_DOMAIN
# (§4.4) — no secrets involved, safe to compute here with plain compose
# variable interpolation.
#
# Required env (source deploy/env/<env>.env before `docker compose up -d`):
#   APP_NAME, APP_ENV, BASE_DOMAIN, ACME_EMAIL
name: ${APP_NAME}-${APP_ENV}-proxy

services:
  caddy-edge:
    image: caddy:2.11-alpine
    container_name: caddy-edge
    restart: unless-stopped
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
      SERVER_DOMAIN: ${APP_NAME}-${APP_ENV}-server.${BASE_DOMAIN}
      WEB_DOMAIN: ${APP_NAME}-${APP_ENV}.${BASE_DOMAIN}
      S3_API_DOMAIN: ${APP_NAME}-${APP_ENV}-s3.${BASE_DOMAIN}
      S3_WEB_DOMAIN: ${APP_NAME}-${APP_ENV}.web.${BASE_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      # Slot files are state (written by deploy.sh), not repo content — bind
      # to the host path deploy.sh/_common.sh already write to.
      - /srv/${APP_NAME}/${APP_ENV}/slots:/etc/caddy/slots:ro
    networks:
      - edge

networks:
  edge:
    external: true

volumes:
  caddy_data:
